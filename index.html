/* ===== STORY HOVER SYSTEM ===== */

.story-stage{
  position:fixed;
  left:50%;
  bottom:150px;
  transform:translateX(-50%);
  width:min(82vw, 520px);
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:2;
}

.story-visual{
  position:relative;
  width:100%;
  max-width:430px;
  aspect-ratio:3 / 2;
  opacity:0;
  transform:scale(0.97);
  transition:opacity 0.55s cubic-bezier(.22,.61,.36,1), transform 0.7s cubic-bezier(.22,.61,.36,1);
  will-change:opacity, transform;
  filter:drop-shadow(0 18px 36px rgba(0,0,0,0.50));
  z-index:1;
}

.story-visual img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;   /* the whole picture always shows, never cropped */
}

/* light pictures (like the paper sketch) get a soft dark veil so the gold sparkle reads */
.story-visual::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.42) 70%, rgba(0,0,0,0.62) 100%);
}
.story-stage.tone-light .story-visual::after{ opacity:1; }

/* a story whose image is not ready yet shows only its line and sparkle */
.story-stage.no-image .story-visual{ visibility:hidden; }

.story-copy{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:82%;
  text-align:center;
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:20px;
  letter-spacing:0.2px;
  line-height:1.2;
  color:rgba(248,232,176,0.98);
  opacity:0;
  transition:opacity 0.35s ease, transform 0.45s ease;
  text-shadow:
    0 2px 3px rgba(0,0,0,1),
    0 0 8px rgba(0,0,0,1),
    0 0 20px rgba(0,0,0,1),
    2px 2px 6px rgba(0,0,0,.95);
  z-index:10;
}

.story-stage.active .story-visual{
  opacity:1;
  transform:scale(1);
}

.story-stage.active .story-copy{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* sparkle covers the whole page, above the dark veil */
.story-pollen{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s ease;
  z-index:4;
}
.story-pollen.active{ opacity:1; }

/* dark veil behind the picture */
.story-dim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.80);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s ease;
  z-index:1;
}
.story-dim.active{ opacity:1; }

.pollen-dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(248,232,176,0.98) 0%,
    rgba(201,162,74,0.72) 38%,
    rgba(201,162,74,0.22) 68%,
    rgba(201,162,74,0) 100%
  );
  box-shadow:
    0 0 10px rgba(255,248,220,1),
    0 0 26px rgba(201,162,74,.75);
  opacity:0;
  will-change:transform, opacity;
  animation:floatUp var(--dur, 2s) cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translate3d(0, 0, 0) scale(0.6);
  }
  12%{
    opacity:0.95;
  }
  100%{
    opacity:0;
    transform:translate3d(var(--drift-x, 0px), var(--drift-y, -80px), 0) scale(1.6);
  }
}

.story-nav{
  text-align:center;
  position:relative;
  z-index:5;
}

.story-links{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:nowrap;
  gap:0;
  white-space:nowrap;
}

.story-link{

<script>
/* ===== MODALS ===== */
let lastFocus = null;

function showDialog(id){
  lastFocus = document.activeElement;
  const el = document.getElementById(id);
  el.style.display = "flex";
  const first = el.querySelector("input, textarea, button");
  if(first) first.focus({preventScroll:true});
}
function hideDialog(id){
  document.getElementById(id).style.display = "none";
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
function openModal(){ showDialog("contactModal"); }
function closeModal(){ hideDialog("contactModal"); }
function openAccessModal(){ showDialog("accessModal"); }
function closeAccessModal(){ hideDialog("accessModal"); }

/* click on the dark backdrop closes; Escape closes */
["contactModal","accessModal"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("click", e => { if(e.target === el) hideDialog(id); });
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  ["contactModal","accessModal"].forEach(id => {
    if(document.getElementById(id).style.display === "flex") hideDialog(id);
  });
  deactivateStory();
});

/* ===== STORY HOVER SYSTEM ===== */

const storyStage  = document.getElementById("storyStage");
const storyImage  = document.getElementById("storyImage");
const storyCopy   = document.getElementById("storyCopy");
const storyPollen = document.getElementById("storyPollen");
const storyDim    = document.getElementById("storyDim");
const storyVisual = document.getElementById("storyVisual");
const storyLinks  = document.querySelectorAll(".story-link");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Preload every story image named in the HTML, once.
   A new name only needs data-image="file.jpg" to join automatically. */
const imageCache = {};   // src -> Promise that resolves true (ready) or false (missing)
function loadImage(src){
  if(!src) return Promise.resolve(false);
  if(!imageCache[src]){
    imageCache[src] = new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        (img.decode ? img.decode() : Promise.resolve())
          .then(() => resolve(true), () => resolve(true));
      };
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }
  return imageCache[src];
}
storyLinks.forEach(link => loadImage(link.dataset.image));

/* Each name bursts from its own small point near the picture,
   then the sparkle drifts out across the whole page (fractions of the screen). */
const pollenConfigs = {
  MISTY:     { count: 100, originX: [13, 17], originY: [6, 10],  driftX: [-0.4, 1.0],  driftY: [-0.3, 0.95] },
  NANCY:     { count: 100, originX: [47, 53], originY: [12, 18], driftX: [-0.9, 0.9],  driftY: [-0.1, 1.0] },
  CAROL:     { count: 104, originX: [8, 14],  originY: [48, 58], driftX: [-0.2, 1.1],  driftY: [-0.6, 0.95] },
  ALISHA:    { count: 100, originX: [86, 92], originY: [48, 58], driftX: [-1.1, 0.2],  driftY: [-0.6, 0.95] },
  DEBBIE:    { count: 96,  originX: [48, 52], originY: [48, 54], driftX: [-0.9, 0.9],  driftY: [-0.7, 0.95] },
  KIMBARBIE: { count: 106, originX: [10, 14], originY: [46, 56], driftX: [-0.2, 1.0],  driftY: [-0.6, 0.95] }
};

function rand(min, max){ return Math.random() * (max - min) + min; }
function clearPollen(){ storyPollen.innerHTML = ""; storyPollen.classList.remove("active"); }

function createPollen(name){
  clearPollen();
  if(reduceMotion) return;
  const config = pollenConfigs[name.toUpperCase()] || pollenConfigs.MISTY;
  const box = storyVisual.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = vw < 520 ? 0.75 : 1;           // a little gentler on phones
  const frag = document.createDocumentFragment();
  for(let i = 0; i < Math.round(config.count * scale); i++){
    const dot = document.createElement("span");
    dot.className = "pollen-dot";
    const x = box.left + box.width  * rand(config.originX[0], config.originX[1]) / 100;
    const y = box.top  + box.height * rand(config.originY[0], config.originY[1]) / 100;
    const size = rand(1.6, 3.8);
    dot.style.left = x + "px";
    dot.style.top = y + "px";
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.setProperty("--drift-x", (rand(config.driftX[0], config.driftX[1]) * vw) + "px");
    dot.style.setProperty("--drift-y", (rand(config.driftY[0], config.driftY[1]) * vh * -1) + "px");
    dot.style.setProperty("--dur", rand(2.6, 3.8) + "s");
    dot.style.animationDelay = rand(0, 0.6) + "s";
    frag.appendChild(dot);
  }
  storyPollen.appendChild(frag);
  storyPollen.classList.add("active");
}

let currentLink = null;
let requestId = 0;   // guards against a slow image arriving after the visitor moved on

/* keep the picture sitting just above the names on every screen size */
const storyNav = document.querySelector(".story-nav");
function placeStage(){
  const top = storyNav.getBoundingClientRect().top;
  storyStage.style.bottom = Math.max(12, window.innerHeight - top + 14) + "px";
  /* on short screens (phone sideways) shrink the picture so it never runs off the top */
  const room = Math.min(top, window.innerHeight) - 30;
  document.getElementById("storyVisual").style.maxWidth = Math.max(160, Math.min(430, room * 1.5)) + "px";
}
window.addEventListener("resize", placeStage);

function activateStory(link){
  clearTimeout(leaveTimer);
  if(currentLink === link) return;
  placeStage();
  currentLink = link;
  const myId = ++requestId;
  const name = link.dataset.name;
  const src  = link.dataset.image;

  storyLinks.forEach(item => item.classList.toggle("active", item === link));

  loadImage(src).then(ready => {
    if(myId !== requestId) return;            // visitor already moved on
    if(ready){
      storyImage.src = src;                   // already decoded: swaps instantly
      storyStage.classList.remove("no-image");
    }else{
      storyStage.classList.add("no-image");   // unfinished story: line + sparkle only
    }
    storyStage.classList.toggle("tone-light", link.dataset.tone === "light");
    storyCopy.textContent = link.dataset.line;
    storyStage.classList.add("active");
    storyDim.classList.add("active");
    createPollen(name);
  });
}

let leaveTimer = null;
function deactivateStory(){
  clearTimeout(leaveTimer);
  requestId++;
  currentLink = null;
  storyLinks.forEach(item => item.classList.remove("active"));
  storyStage.classList.remove("active");
  storyDim.classList.remove("active");
  storyPollen.classList.remove("active");
  setTimeout(() => { if(!currentLink) clearPollen(); }, 350);
}

/* Mouse: hover. Touch: tap to open, tap again to close. Keyboard: focus. */
let lastPointer = "mouse";
storyLinks.forEach(link => {
  link.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });
  link.addEventListener("pointerenter", e => { if(e.pointerType === "mouse") activateStory(link); });
  link.addEventListener("pointerleave", e => {
    if(e.pointerType !== "mouse") return;
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(deactivateStory, 160);
  });
  link.addEventListener("focus", () => { if(link.matches(":focus-visible")) activateStory(link); });
  link.addEventListener("blur", () => { if(currentLink === link && lastPointer !== "touch") deactivateStory(); });
  link.addEventListener("click", e => {
    e.preventDefault();
    if(lastPointer === "mouse") { activateStory(link); return; }
    if(currentLink === link) deactivateStory(); else activateStory(link);
  });
});

/* tapping anywhere else on a phone closes the story */
document.addEventListener("pointerdown", e => {
  if(e.pointerType !== "mouse" && currentLink && !e.target.closest(".story-link")) deactivateStory();
});

deactivateStory();
</script>
