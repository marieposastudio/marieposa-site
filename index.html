/* ===== STORY HOVER SYSTEM ===== */

.story-stage{
  position:fixed;
  left:50%;
  bottom:150px;
  transform:translateX(-50%);
  width:min(82vw, 520px);
  min-height:180px;
  display:flex;
  align-items:center;

  .story-visual{

  z-index:1;
}
  
.story-pollen{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.35s ease;
  z-index:5;
}

.story-copy{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:82%;
  text-align:center;
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:20px;
  letter-spacing:0.2px;
  line-height:1.2;
  color:rgba(248,232,176,0.98);
  opacity:0;
  transition:opacity 0.35s ease, transform 0.45s ease;
  text-shadow:
  0 2px 3px rgba(0,0,0,1),
  0 0 8px rgba(0,0,0,1),
  0 0 20px rgba(0,0,0,1),
  2px 2px 6px rgba(0,0,0,.95);
  z-index:10;  
}

.story-stage.active .story-visual{
  opacity:1;
  transform:scale(1);
}

.story-stage.active .story-copy{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.story-pollen{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.35s ease;
  z-index:5;
}

.story-stage.active .story-pollen{
  opacity:1;
}

.pollen-dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(248,232,176,0.98) 0%,
    rgba(201,162,74,0.72) 38%,
    rgba(201,162,74,0.22) 68%,
    rgba(201,162,74,0) 100%
  );
 box-shadow:
  0 0 12px rgba(255,248,220,1),
  0 0 28px rgba(248,232,176,.95),
  0 0 55px rgba(201,162,74,.8),
  0 0 90px rgba(201,162,74,.45);
  opacity:0;
  animation:floatUp 2.05s ease-out forwards;
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translate3d(0, 0, 0) scale(0.7);
  }
  15%{
    opacity:0.95;
  }
  100%{
    opacity:0;
    transform:translate3d(var(--drift-x, 0px), var(--drift-y, -80px), 0) scale(1.15);
  }
}

.story-nav{

  position:relative;

<script>
function openModal(){
  document.getElementById("contactModal").style.display="flex";
}
function closeModal(){
  document.getElementById("contactModal").style.display="none";
}

function openAccessModal(){
  document.getElementById("accessModal").style.display="flex";
}
function closeAccessModal(){
  document.getElementById("accessModal").style.display="none";
}

/* ===== STORY HOVER SYSTEM ===== */

const storyStage = document.getElementById("storyStage");
const storyImage = document.getElementById("storyImage");
const storyCopy = document.getElementById("storyCopy");
const storyPollen = document.getElementById("storyPollen");
const storyLinks = document.querySelectorAll(".story-link");

const pollenConfigs = {
  MISTY: {
  count: 36,
  originX: [13, 17],
originY: [6, 10],
  driftX: [90, 220],
  driftY: [10, 90]
},
  NANCY: {
    count: 36,
    originX: [47, 53],
    originY: [12, 18],
    driftX: [-90, 90],
    driftY: [58, 126]
  },
  CAROL: {
    count: 38,
    originX: [8, 14],
    originY: [48, 58],
    driftX: [70, 170],
    driftY: [-55, 55]
  },
  Alisha: {
    count: 36,
    originX: [86, 92],
    originY: [48, 58],
    driftX: [-170, -70],
    driftY: [-55, 55]
  },
  DEBBIE: {
    count: 32,
    originX: [48, 52],
    originY: [48, 54],
    driftX: [-110, 110],
    driftY: [-90, 90]
  },
  KIMBARBIE: {
    count: 42,
    originX: [10, 14],
    originY: [46, 56],
    driftX: [60, 150],
    driftY: [-45, 45]
  }
};

function rand(min, max){
  return Math.random() * (max - min) + min;
}

function clearPollen(){
  storyPollen.innerHTML = "";
}

function createPollen(name){
  clearPollen();
  const config = pollenConfigs[name] || pollenConfigs.MISTY;

  for(let i = 0; i < config.count; i++){
    const dot = document.createElement("span");
    dot.className = "pollen-dot";

    const left = rand(config.originX[0], config.originX[1]);
    const top = rand(config.originY[0], config.originY[1]);
    const driftX = rand(config.driftX[0], config.driftX[1]);
    const driftY = rand(config.driftY[0], config.driftY[1]);
    const delay = rand(0, 0.55);
    const size = rand(1.4, 3.2);

    dot.style.left = left + "%";
    dot.style.top = top + "%";
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.setProperty("--drift-x", driftX + "px");
    dot.style.setProperty("--drift-y", driftY + "px");
    dot.style.animationDelay = delay + "s";

    storyPollen.appendChild(dot);
  }
}

function activateStory(link){
  const name = link.dataset.name;
  const image = link.dataset.image;
  const line = link.dataset.line;

  storyLinks.forEach(item => item.classList.remove("active"));
  link.classList.add("active");

  if(image){
    storyImage.src = image;
  }

  storyCopy.textContent = line;
  storyStage.classList.add("active");
  createPollen(name);
}

function deactivateStory(){
  storyLinks.forEach(item => item.classList.remove("active"));
  storyStage.classList.remove("active");
  clearPollen();
}

storyLinks.forEach(link => {
  link.addEventListener("mouseenter", () => activateStory(link));
  link.addEventListener("mouseleave", deactivateStory);
});

deactivateStory();
</script>
